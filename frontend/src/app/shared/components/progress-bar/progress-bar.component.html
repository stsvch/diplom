<!-- progress-bar.component.html -->
<!-- Основной контейнер задает структуру и визуальный контекст шаблона. -->
<div class="progress-bar">
  <div class="progress-bar__track">
    <div
      class="progress-bar__fill"
      [class]="'progress-bar__fill--' + barColor()"
      [style.width.%]="clampedValue()"
    ></div>
  </div>
  <!-- Условный блок переключает состояние отображения по данным компонента. -->
  @if (showLabel) {
    <span class="progress-bar__label">{{ clampedValue() }}%</span>
  }
</div>
