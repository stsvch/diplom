<div class="rte">
  <div class="rte__toolbar">
    @for (action of actions; track action.key) {
      <button
        type="button"
        class="rte__btn"
        [title]="action.title"
        (click)="applyAction(action)"
      >
        <lucide-icon [img]="action.icon" [size]="14" />
      </button>
    }
    <span class="rte__filler"></span>
    <span class="rte__hint">Markdown</span>
  </div>

  <div class="rte__body">
    <textarea
      #ta
      class="rte__textarea"
      [rows]="rows"
      [placeholder]="placeholder"
      [style.minHeight]="minHeight"
      [value]="content"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
    ></textarea>
  </div>
</div>
