<!-- avatar.component.html -->
<!-- Основной контейнер задает структуру и визуальный контекст шаблона. -->
<div class="avatar" [class]="'avatar avatar--' + size">
  <!-- Условный блок переключает состояние отображения по данным компонента. -->
  @if (src && !imageError()) {
    <img
      class="avatar__img"
      [src]="src"
      [alt]="alt"
      (error)="onImageError()"
    />
  } @else {
    <span class="avatar__initials">{{ initials }}</span>
  }
</div>
